<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="officeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Grid patterns -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="200" r="160" fill="#f97316" opacity="0.18" filter="url(#glow)" />
  <circle cx="480" cy="240" r="120" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />

  <!-- Glass Card Center -->
  <rect x="180" y="70" width="440" height="310" rx="24" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

  <!-- Microsoft Office Colorful Tiles -->
  <g transform="translate(350, 115)">
    <!-- Word Blue -->
    <rect x="-45" y="0" width="38" height="38" rx="8" fill="#2563eb" />
    <text x="-26" y="26" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">W</text>
    
    <!-- Excel Green -->
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#16a34a" />
    <text x="19" y="26" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">X</text>

    <!-- PowerPoint Orange -->
    <rect x="45" y="0" width="38" height="38" rx="8" fill="#ea580c" />
    <text x="64" y="26" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>

    <!-- OneNote Purple -->
    <rect x="90" y="0" width="38" height="38" rx="8" fill="#9333ea" />
    <text x="109" y="26" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    OFFICE DEPLOYMENT
  </text>
  <text x="400" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">
    HỖ TRỢ TẢI &amp; KÍCH HOẠT BẢN QUYỀN
  </text>
  <text x="400" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">
    All Versions • One-Click Script • Free Deployment
  </text>

  <!-- Status pill -->
  <rect x="330" y="305" width="140" height="30" rx="15" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1" />
  <circle cx="348" cy="320" r="4" fill="#22c55e" />
  <text x="408" y="325" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#22c55e" text-anchor="middle">
    READY TO USE
  </text>
</svg>
